[bar.default]
center = [ "media" ]
end = [ "clock", "network", "tray", "bluetooth", "volume", "brightness", "battery", "clipboard", "notifications" ]
start = [ "session", "control-center", "wallpaper", "launcher", "workspaces" ]

[control_center.media]
show_visualizer = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-4"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "IosevkaTerm Nerd Font Mono"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[wallpaper]
directory = "/home/gus/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/gus/Pictures/Wallpapers/a_metal_staircase_with_a_railing.jpg"

    [wallpaper.last]
    path = "/home/gus/Pictures/Wallpapers/a_metal_staircase_with_a_railing.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/gus/Pictures/Wallpapers/a_metal_staircase_with_a_railing.jpg"

[widget.battery]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.network]
show_label = false

[widget.tray]
enabled = false

[widget.volume]
enabled = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
enabled = false
